<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Week 6 - DOM & Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Implementasi DOM, Event Handling & Fetch API</h1>

        <!-- BAGIAN 2: Form - DOM & Event Handling -->
        <section id="form-section" class="card">
            <h2>Form Pendaftaran Member</h2>
            <p>Silakan isi form di bawah ini untuk menguji Event Handling & DOM.</p>
            
            <form id="memberForm">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap:</label>
                    <input type="text" id="fullname" placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label for="email">Alamat Email:</label>
                    <input type="email" id="email" placeholder="Masukkan email Anda">
                </div>
                <button type="submit" id="submitBtn">Daftar Sekarang</button>
            </form>
            
            <!-- Tempat untuk menampilkan feedback hasil form -->
            <div id="formFeedback" class="feedback-box" style="display: none;"></div>
        </section>

        <!-- BAGIAN 1: Fetch API - Data Produk -->
        <section id="fetch-section" class="card">
            <h2>Daftar Produk (DummyJSON)</h2>
            <p>Data di bawah ini diambil menggunakan Fetch API.</p>
            
            <!-- Tempat menampilkan status loading, error, atau list produk -->
            <div id="productContainer">
                <p id="loadingMsg" class="info-msg">Memuat data produk...</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

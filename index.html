<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Week 6</title>
    <!-- Menggunakan font Inter dari Google Fonts untuk kesan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- Form Pendaftaran -->
        <section class="form-section">
            <h2>Pendaftaran Member</h2>
            
            <form id="memberForm">
                <div class="input-group">
                    <input type="text" id="fullname" placeholder="Nama Lengkap">
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Alamat Email">
                </div>
                <button type="submit" id="submitBtn">Daftar</button>
            </form>
            
            <div id="formFeedback" class="feedback-box" style="display: none;"></div>
        </section>

        <!-- Daftar Produk -->
        <section class="product-section">
            <h2>Katalog Produk</h2>
            
            <div id="productContainer">
                <p id="loadingMsg" class="info-msg">Memuat katalog...</p>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
